name: Server binaries

on:
  push:
    tags:
      - "server-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: linux-x64
            executable: anydatas-api
          - os: windows-2025
            asset: windows-x64
            executable: anydatas-api.exe
          - os: macos-15
            asset: macos-arm64
            executable: anydatas-api
          - os: macos-15-intel
            asset: macos-x64
            executable: anydatas-api

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p ../dist/server-release
          cp "target/release/${{ matrix.executable }}" "../dist/server-release/anydatas-server-${{ matrix.asset }}"
          chmod 755 "../dist/server-release/anydatas-server-${{ matrix.asset }}"

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist/server-release | Out-Null
          Copy-Item "target/release/${{ matrix.executable }}" "../dist/server-release/anydatas-server-${{ matrix.asset }}.exe"

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: anydatas-server-${{ matrix.asset }}
          path: dist/server-release/*
          if-no-files-found: error

  release:
    name: Publish server release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: anydatas-server-*
          path: dist/server-release
          merge-multiple: true

      - name: Generate verified manifest
        run: node backend/scripts/build-release-manifest.mjs dist/server-release "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/server-release/* --verify-tag --generate-notes --title "AnyDatas Server ${GITHUB_REF_NAME#server-v}"
