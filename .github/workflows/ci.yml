name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: anydatas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q app scripts tests

      - name: Run automated tests
        run: python -m pytest

      - name: Run end-to-end smoke test
        run: python tests/smoke_test.py

      - name: Validate single-server Compose configuration
        run: docker compose -f docker-compose.yml config -q

      - name: Validate optional monitoring Compose configuration
        env:
          ANYDATAS_GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: |
          cp monitoring/metrics-token.example monitoring/metrics-token
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config -q
