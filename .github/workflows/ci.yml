name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # PR 与其目标分支共享并发组；合并后只保留最终 main 验证，避免同一提交重复消耗 Actions。
  group: anydatas-ci-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: backend-tests

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run backend tests
        # 45 分钟上限覆盖 GitHub 托管机首次源码构建，同时仍能识别真正卡死的任务。
        run: cargo test --locked

  backend_clippy:
    name: Rust backend Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: backend-clippy

      - name: Run strict Clippy
        # DuckDB 的测试与 Clippy 静态归档不能同时留在 GitHub Runner 的小磁盘上。
        # 独立 Runner 既隔离磁盘占用又并行执行，冷缓存耗时不再累加到同一个作业。
        run: cargo clippy --all-targets --locked -- -D warnings

  frontend:
    name: Vue frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Build production frontend
        run: pnpm --dir frontend build

  desktop:
    name: Electron desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install desktop and renderer dependencies
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile

      - name: Run desktop tests and typecheck
        run: |
          pnpm --dir desktop test
          pnpm --dir desktop typecheck

      - name: Verify production Electron renderer
        # GitHub 托管 Runner 无法把 Electron 下载的 chrome-sandbox 设为 root:4755；
        # 仅 smoke 子进程禁用 OS sandbox，产品 BrowserWindow 仍保持 sandbox: true。
        run: xvfb-run -a pnpm --dir desktop test:renderer:ci

  operations:
    name: Operations and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile operations scripts
        run: python -m py_compile scripts/backup.py scripts/restore.py scripts/retention.py

      - name: Run backup and restore tests
        run: python -m unittest discover -s ops_tests -v

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/anydatas-single-server.json >/dev/null

      - name: Validate Compose configurations
        env:
          ANYDATAS_GRAFANA_ADMIN_PASSWORD: ci-validation-only
        run: |
          cp monitoring/metrics-token.example monitoring/metrics-token
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.operations.yml --profile tools config -q
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config -q

      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            -v "$PWD/monitoring/metrics-token.example:/run/secrets/anydatas_metrics_token:ro" \
            prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml

  container:
    name: Production container
    needs: [backend, backend_clippy, frontend, desktop, operations]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
