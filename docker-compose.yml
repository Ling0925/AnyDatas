services:
  anydatas:
    # duckdb-prebuilt 当前提供 Linux x64；Apple Silicon Docker Desktop 会透明使用 x64 模拟。
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: anydatas:rust-mvp
    container_name: anydatas
    environment:
      ANYDATAS_BIND: 0.0.0.0:8080
      ANYDATAS_DATA_DIR: /data
      ANYDATAS_WEB_DIR: /app/web
      ANYDATAS_MAX_UPLOAD_BYTES: ${ANYDATAS_MAX_UPLOAD_BYTES:-104857600}
      ANYDATAS_SESSION_TTL_DAYS: ${ANYDATAS_SESSION_TTL_DAYS:-7}
      ANYDATAS_COOKIE_SECURE: ${ANYDATAS_COOKIE_SECURE:-0}
      ANYDATAS_QUERY_MAX_CONCURRENCY: ${ANYDATAS_QUERY_MAX_CONCURRENCY:-2}
      ANYDATAS_FILE_PARSE_MAX_CONCURRENCY: ${ANYDATAS_FILE_PARSE_MAX_CONCURRENCY:-1}
      ANYDATAS_RESOURCE_QUEUE_TIMEOUT_SECONDS: ${ANYDATAS_RESOURCE_QUEUE_TIMEOUT_SECONDS:-30}
      ANYDATAS_QUERY_TIMEOUT_SECONDS: ${ANYDATAS_QUERY_TIMEOUT_SECONDS:-120}
      ANYDATAS_BACKGROUND_QUERY_TIMEOUT_SECONDS: ${ANYDATAS_BACKGROUND_QUERY_TIMEOUT_SECONDS:-3600}
      ANYDATAS_FILE_PARSE_TIMEOUT_SECONDS: ${ANYDATAS_FILE_PARSE_TIMEOUT_SECONDS:-1800}
      ANYDATAS_DUCKDB_MEMORY_LIMIT_MB: ${ANYDATAS_DUCKDB_MEMORY_LIMIT_MB:-1024}
      ANYDATAS_DUCKDB_THREADS: ${ANYDATAS_DUCKDB_THREADS:-4}
      ANYDATAS_DUCKDB_TEMP_LIMIT_MB: ${ANYDATAS_DUCKDB_TEMP_LIMIT_MB:-10240}
      ANYDATAS_MIN_FREE_SPACE_MB: ${ANYDATAS_MIN_FREE_SPACE_MB:-1024}
      ANYDATAS_JOB_RESULT_MAX_MB: ${ANYDATAS_JOB_RESULT_MAX_MB:-20480}
      ANYDATAS_JOB_RESULT_RETENTION_DAYS: ${ANYDATAS_JOB_RESULT_RETENTION_DAYS:-30}
      ANYDATAS_AGENT_MAX_STEPS: ${ANYDATAS_AGENT_MAX_STEPS:-6}
      ANYDATAS_AGENT_TIMEOUT_SECONDS: ${ANYDATAS_AGENT_TIMEOUT_SECONDS:-300}
      ANYDATAS_AGENT_CONTEXT_CHARS: ${ANYDATAS_AGENT_CONTEXT_CHARS:-80000}
      RUST_LOG: ${RUST_LOG:-anydatas_api=info,tower_http=info}
    ports:
      - "${ANYDATAS_HOST_BIND:-127.0.0.1}:${ANYDATAS_PORT:-28080}:8080"
    volumes:
      - anydatas-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/readyz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  anydatas-data:
