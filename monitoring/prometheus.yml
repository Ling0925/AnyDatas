global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/anydatas-alerts.yml

scrape_configs:
  - job_name: anydatas
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/anydatas_metrics_token
    static_configs:
      - targets: ["anydatas:8000"]
