groups:
  - name: anydatas-single-server
    rules:
      - alert: AnyDatasApiDown
        expr: up{job="anydatas"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AnyDatas metrics endpoint is unavailable.
      - alert: AnyDatasJobWorkerDown
        expr: anydatas_worker_up{worker="jobs"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AnyDatas background job worker is not active.
      - alert: AnyDatasScheduleWorkerDown
        expr: anydatas_worker_up{worker="schedules"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AnyDatas schedule worker is not active.
      - alert: AnyDatasFailedJobs
        expr: anydatas_jobs{status="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AnyDatas has failed background jobs.
      - alert: AnyDatasJobBacklog
        expr: anydatas_jobs{status="queued"} > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AnyDatas has more than 20 queued background jobs.
      - alert: AnyDatasStorageLow
        expr: anydatas_storage_available_bytes < 1073741824
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: AnyDatas data volume has less than 1 GiB available.
