appId: com.anydatas.desktop
productName: AnyDatas
asar: true
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - package.json
  # 主进程依赖已由 esbuild 打进 main.js；排除源码依赖可显著缩小安装包和攻击面。
  - "!node_modules/**/*"

# 前端作为只读资源放在 app.asar 外；主进程通过 process.resourcesPath 定位，
# 这样开发目录和安装目录都使用同一套页面且不依赖用户机器上的源码树。
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
    filter:
      - "**/*"

win:
  # 显式复用前端品牌资源，避免新版安装包继续显示 Electron 默认图标。
  # 使用同一个源文件也能让 README、浏览器和 Windows 客户端保持一致。
  icon: ../frontend/public/anydatas-logo.png
  executableName: AnyDatas
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AnyDatas-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: AnyDatas
  uninstallDisplayName: AnyDatas
  deleteAppDataOnUninstall: false
