<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Reset Password · AnyDatas</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/i18n.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="topbar">
      <div>
        <h1>AnyDatas</h1>
        <p>{{ reset.workspace_name }}</p>
      </div>
      <nav><a href="/login">Sign in</a></nav>
    </header>
    <main class="workspace auth-page">
      <form class="panel auth-panel" action="/reset-password/{{ token }}" method="post">
        <h2>Reset Password</h2>
        {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
        <input name="username" type="email" value="{{ reset.email }}" autocomplete="username" hidden>
        <label>
          New password
          <input name="password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label>
          Confirm password
          <input name="password_confirmation" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <button type="submit">Reset Password</button>
      </form>
    </main>
  </body>
</html>
