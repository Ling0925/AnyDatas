<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Password Reset Created · AnyDatas</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/i18n.js" defer></script>
  </head>
  <body class="auth-body">
    <header class="topbar">
      <div>
        <h1>AnyDatas</h1>
        <p>Password reset created</p>
      </div>
      <nav><a href="/#members">Members</a></nav>
    </header>
    <main class="workspace auth-page">
      <section class="panel auth-panel">
        <h2>{{ member.name }}</h2>
        <p>{{ member.email }} · Expires {{ expires_at[:19].replace("T", " ") }}</p>
        <label>
          One-time link
          <input value="{{ reset_url }}" readonly>
        </label>
        <a class="button-link" href="{{ reset_url }}">Open Reset</a>
      </section>
    </main>
  </body>
</html>
