services:
  anydatas:
    environment:
      ANYDATAS_METRICS_TOKEN: ""
      ANYDATAS_METRICS_TOKEN_FILE: /run/secrets/anydatas_metrics_token
    volumes:
      - ./monitoring/metrics-token:/run/secrets/anydatas_metrics_token:ro

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      anydatas:
        condition: service_healthy
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/anydatas-alerts.yml:/etc/prometheus/anydatas-alerts.yml:ro
      - ./monitoring/metrics-token:/run/secrets/anydatas_metrics_token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${ANYDATAS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ANYDATAS_GRAFANA_ADMIN_PASSWORD:?Set ANYDATAS_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - prometheus
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
